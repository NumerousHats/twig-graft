[project]
name = "twig-grafter"
version = "0.1.0"
description = "Construct twigs from Greek Catholic birth and death records, find overlaps via graph matching, and graft them into larger family trees."
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.4,<3.5",
    "click~=7.1.2",
    "streamlit>=1.30",
    "pyvis>=0.3",
]

[tool.uv]
dev-dependencies = [
    "pytest",
]
